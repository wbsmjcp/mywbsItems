<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Development Challenges Visualisation</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 20vh; }
        html { font-size: 14px;}
        #viz-container { width: 90%; max-width: 1200px; padding: 40px; background-color: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; margin: 20px 0; }
        .row { display: flex; align-items: center; justify-content: space-between; }
        .person-container { text-align: center; width: 250px; position: relative; }
        .person-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; display: block; position: absolute; top: -40px; left: 50%; transform: translateX(-50%); }
        .person-circle { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #ddd; overflow: hidden; margin: 0 auto; transition: opacity 0.3s ease; }
        .person-image { width: 100%; height: 100%; object-fit: cover; }
        .academic .person-circle { border-color: #3498db; } /* Blue for Academic */
        .academic .person-text { color: #3498db; }
        .professional-staff .person-circle { border-color: #27ae60; } /* Green for Staff */
        .professional-staff .person-text { color: #27ae60; }
        #factors-list { width: 40%; text-align: center; display: flex; flex-direction: column; gap: 2px; padding: 10px 0; }
        .factor-item { padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: background 0.3s ease, border-color 0.3s ease; font-size: 1.5vw; color: #333; position: relative; }
        .common { border: 2px solid #ddd; }
        .uncommon-academic { border: 2px solid #ddd; }
        .uncommon-staff { border: 2px solid #ddd; }
        .common:hover { border: 2px solid #222; }
        .uncommon-academic:hover { border: 2px solid #3498db; }
        .uncommon-staff:hover { border: 2px solid #27ae60; }
        .factor-item:hover { background-color: #f9f9f9; }
        .factor-item .connection { display: none; } /* Initially hide connections */
        #popup-card { display: none; position: fixed; top: 30%; left: 50%; transform: translate(-30%, -50%); width: 400px; background-color: #fff; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); z-index: 100; overflow: hidden; }
        #popup-content { padding: 20px; font-size: 1rem; color: #333; }
        #close-popup { display: block; text-align: right; padding: 10px; font-size: 1.2rem; cursor: pointer; color: #777; transition: color 0.3s ease; border-bottom: 1px solid #eee; }
        #close-popup:hover { color: #333; }
        #factors-list .factor-item { z-index: 10; } /* Ensure factors are always on top of connections on the list side */
        /* SVG definitions for network lines - absolutely positioned over everything else */
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        line { stroke-width: 2px; }
    </style>
</head>
<body>

    <h1 style="color: #333; margin: 20px 0;">Why Module Development Takes a While</h1>
    <p style="color: #555; text-align: center; max-width: 800px; margin-bottom: 15px;">This interactive visualisation highlights common and distinct factors impacting module development timelines from the perspective of Academic and Professional Service Staff. Hover over a factor to see the connection.</p>

    <div id="viz-container">
        <!-- SVG lines container -->
        <svg id="connection-svg">
            <line id="academic-line" x1="0" y1="0" x2="0" y2="0" stroke="#3498db" />
            <line id="staff-line" x1="0" y1="0" x2="0" y2="0" stroke="#27ae60" />
        </svg>

        <div class="row">
            <!-- Academic -->
            <div class="person-container academic" id="academic-person">
                <span class="person-text">Academic</span>
                <div class="person-circle">
                    <!-- Illustration: an academic, possibly with books or glasses -->
                    <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Academic Person Illustration" class="person-image">
                </div>
            </div>

            <!-- Central Factors List -->
            <div id="factors-list">
                <!-- Data will be populated here -->
            </div>

            <!-- Professional Staff -->
            <div class="person-container professional-staff" id="staff-person">
                <span class="person-text">Professional Staff</span>
                <div class="person-circle">
                    <!-- Illustration: professional staff, modern attire, possibly with a laptop or tablet -->
                    <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Professional Staff Person Illustration" class="person-image">
                </div>
            </div>
        </div>
    </div>

    <!-- Popup Card -->
    <div id="popup-card">
        <!-- <span id="close-popup">&times;</span> -->
        <div id="popup-content"></div>
    </div>

    <script>
        const factors = [
            { id: 1, name: "Marking", type: "academic", text: "Often times we are aware that marking can be a big time sync, and is one of the biggest impacts to people delivering drafts on time. We try to schedule draft submissions to work around this constraint, as well as booking in filming when marking is not at its peak" },
            { id: 2, name: "Committee meetings", type: "common", text: "Often necessary for institutional buy-in and governance approvals, but hard to schedule and can introduce significant delays as they only meet periodically." },
            { id: 3, name: "Editing media", type: "staff", text: "The post-production process is incredibly labor-intensive. Edits, motion graphics, and audio work take hours for every minute of video, and technical issues cause unexpected slowdowns." },
            { id: 4, name: "Lecturing", type: "academic", text: "A primary responsibility that takes precedent over development. Busy weeks with heavy lecturing loads leave little mental bandwidth or time for creating new module content." },
            { id: 5, name: "Attending group meetings", type: "common", text: "Critical for project alignment, but finding time when *all* key stakeholders are available is a major challenge, causing progress to stutter." },
            { id: 6, name: "Creating presentations", type: "common", text: "Required for getting feedback and presenting to leadership. It takes considerable time to compile material, and revisions based on feedback cause delays." },
            { id: 7, name: "Team training", type: "staff", text: "New software or institutional processes require continuous upskilling. Dedicated time for internal staff development impacts the capacity for project work." },
            { id: 8, name: "PhD support", type: "academic", text: "Providing guidance to research students is demanding and time-sensitive. Urgent student needs can divert attention from module development for long periods." },
            { id: 9, name: "Delivering staff training", type: "staff", text: "Sharing expertise is crucial, but running workshops, creating training materials, and presenting are huge time investments, reducing time available for project tasks." },
            { id: 10, name: "Attending learning conferences and events", type: "common", text: "Continuous development is key, but time spent away at workshops or events means less time focused on development milestones." },
            { id: 11, name: "Publishing material", type: "staff", text: "Uploading and organizing content in the VLE is complex. Verifying consistency, fixing technical bugs, and managing permissions takes meticulous time." },
            { id: 12, name: "Reviewing academic work", type: "common", text: "Peer reviews and external examiner feedback are essential, but the process can be slow and unpredictable, adding time to final approval." },
            { id: 13, name: "Transcribing and subtitling", type: "staff", text: "An essential accessibility requirement. Manually transcribing video or reviewing automatic captions for accuracy is highly time-consuming, adding a delay to final publication." },
            { id: 14, name: "Filming", type: "common", text: "Securing studio time, coordinating with academic staff and film crews, and post-production all take much longer than expected, creating serious bottlenecks." },
            { id: 15, name: "Holidays", type: "common", text: "Essential for work-life balance, but they often disrupt continuous development. Poorly planned holiday schedules can halt a project completely." },
            { id: 16, name: "Illness", type: "common", text: "Unpredictable and inevitable, impacting both staff availability and momentum. It's one of the biggest reasons for unexpected deadlines being missed." }
        ];

        // Shuffle the factors array for random order in the middle
        function shuffle(array) {
          for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
          }
        }
        shuffle(factors);

        const factorsList = document.getElementById('factors-list');
        const popupCard = document.getElementById('popup-card');
        const popupContent = document.getElementById('popup-content');
        const closePopup = document.getElementById('close-popup');
        const academicPerson = document.getElementById('academic-person');
        const staffPerson = document.getElementById('staff-person');
        const connectionSvg = document.getElementById('connection-svg');
        const academicLine = document.getElementById('academic-line');
        const staffLine = document.getElementById('staff-line');

        const vizContainer = document.getElementById('viz-container');

        // Populate the list
        factors.forEach(factor => {
            const listItem = document.createElement('div');
            listItem.classList.add('factor-item');
            listItem.dataset.type = factor.type;
            listItem.dataset.text = factor.text;
            listItem.textContent = factor.name;

            if (factor.type === "common") listItem.classList.add('common');
            else if (factor.type === "academic") listItem.classList.add('uncommon-academic');
            else if (factor.type === "staff") listItem.classList.add('uncommon-staff');

            factorsList.appendChild(listItem);
        });

        const academicCenter = { x: academicPerson.offsetLeft + academicPerson.offsetWidth / 2, y: academicPerson.offsetTop + academicPerson.offsetHeight / 2 };
        const staffCenter = { x: staffPerson.offsetLeft + staffPerson.offsetWidth / 2, y: staffPerson.offsetTop + staffPerson.offsetHeight / 2 };

        // Hide connections initially
        function resetViz() {
            academicLine.setAttribute('x1', 0); academicLine.setAttribute('y1', 0); academicLine.setAttribute('x2', 0); academicLine.setAttribute('y2', 0);
            staffLine.setAttribute('x1', 0); staffLine.setAttribute('y1', 0); staffLine.setAttribute('x2', 0); staffLine.setAttribute('y2', 0);
            academicPerson.style.opacity = 1;
            staffPerson.style.opacity = 1;
            popupCard.style.display = 'none';
        }
        
        // Use ResizeObserver for accurate center calculations, even with CSS layout shifts
        const ro = new ResizeObserver(entries => {
            academicCenter.x = academicPerson.offsetLeft + academicPerson.offsetWidth / 2; academicCenter.y = academicPerson.offsetTop + academicPerson.offsetHeight / 2;
            staffCenter.x = staffPerson.offsetLeft + staffPerson.offsetWidth / 2; staffCenter.y = staffPerson.offsetTop + staffPerson.offsetHeight / 2;
        });
        ro.observe(vizContainer);

        vizContainer.addEventListener('mouseover', function(e) {
            const factorItem = e.target.closest('.factor-item');
            if (factorItem) {
                resetViz(); // Clear previous state

                const rect = factorItem.getBoundingClientRect();
                const containerRect = vizContainer.getBoundingClientRect();
                const factorCenter = {
                    x: rect.left - containerRect.left + rect.width / 2,
                    y: rect.top - containerRect.top + rect.height / 2
                };

                const type = factorItem.dataset.type;

                // Handle network connections and opacity
                if (type === "common") {
                    academicLine.setAttribute('x1', academicCenter.x); academicLine.setAttribute('y1', academicCenter.y); academicLine.setAttribute('x2', factorCenter.x); academicLine.setAttribute('y2', factorCenter.y);
                    staffLine.setAttribute('x1', staffCenter.x); staffLine.setAttribute('y1', staffCenter.y); staffLine.setAttribute('x2', factorCenter.x); staffLine.setAttribute('y2', factorCenter.y);
                } else if (type === "academic") {
                    academicLine.setAttribute('x1', academicCenter.x); academicLine.setAttribute('y1', academicCenter.y); academicLine.setAttribute('x2', factorCenter.x); academicLine.setAttribute('y2', factorCenter.y);
                    staffPerson.style.opacity = 0.2;
                } else if (type === "staff") {
                    staffLine.setAttribute('x1', staffCenter.x); staffLine.setAttribute('y1', staffCenter.y); staffLine.setAttribute('x2', factorCenter.x); staffLine.setAttribute('y2', factorCenter.y);
                    academicPerson.style.opacity = 0.2;
                }

                // Show popup with specific text
                popupContent.innerHTML = `<strong>${factorItem.textContent}</strong><br><br>${factorItem.dataset.text}`;
                popupCard.style.display = 'block';
            }
        });
vizContainer.addEventListener('mouseout', function(e) {
    // Check if the mouse was on a factor item
    const currentItem = e.target.closest('.factor-item');
    // Check where the mouse is moving TO
    const nextItem = e.relatedTarget ? e.relatedTarget.closest('.factor-item') : null;

    // If we just left a factor item, and we aren't moving into the SAME factor item, clear it!
    if (currentItem && currentItem !== nextItem) {
        resetViz();
    }
});
        // Close popup on click outside or close button
        window.addEventListener('click', function(e) {
            if (e.target === popupCard || e.target === closePopup || !e.target.closest('#popup-card') && !e.target.closest('.factor-item')) {
                resetViz();
            }
        });

    </script>
</body>
</html>
